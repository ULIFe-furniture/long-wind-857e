# ══════════════════════════════════════════════════════════════
# ULIFe — ZALO BOT GATEWAY (worker ĐỘC LẬP)
# QUAN TRỌNG: name PHẢI KHÁC "ulife-brain". Đây là một worker RIÊNG làm cổng
# cho Zalo Bot cá nhân; nó GỌI sang ulife-brain qua HTTP. Nếu đặt name="ulife-brain"
# bạn sẽ GHI ĐÈ bộ não đang chạy.
# ══════════════════════════════════════════════════════════════
name = "ulife-zalobot"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Gốc worker bộ não đã deploy. Gateway POST tới ${BRAIN_URL}${BRAIN_REPLY_PATH}.
BRAIN_URL = "https://ulife-brain.cskhufuniture.workers.dev"
# >>> CHỈNH cho khớp endpoint trả lời của brain (vd "/reply", "/", "/botcake").
#     Nếu chưa chắc, xem route trong src/index.js của ulife-brain.
BRAIN_REPLY_PATH = "/reply"
BRAIN_TIMEOUT_MS = "20000"
# Chống spam: số tin tối đa mỗi chat / phút (cần KV để có hiệu lực).
CHANNEL_RATE_LIMIT_PER_MIN = "20"

# ──────────────────────────────────────────────────────────────
# KV (tuỳ chọn nhưng NÊN bật): dedupe update_id + rate-limit.
# Tạo namespace MỚI cho gateway (đừng trộn với KV của brain):
#   npx wrangler kv namespace create ZALOBOT_KV
#   -> copy id in ra, dán vào dưới, BỎ comment 3 dòng.
# Thiếu KV: worker vẫn chạy, chỉ là không dedupe/không rate-limit.
# ──────────────────────────────────────────────────────────────
# [[kv_namespaces]]
# binding = "KV"
# id = "PASTE_KV_ID_HERE"

# ──────────────────────────────────────────────────────────────
# SECRET — nạp bằng wrangler (KHÔNG ghi token vào file này):
#   npx wrangler secret put ZALOBOT_TOKEN          # token Zalo Bot (bot-api.zapps.me)
#   npx wrangler secret put ZALOBOT_WEBHOOK_SECRET # chuỗi tự đặt, trùng secret_token khi setWebhook
#   npx wrangler secret put APP_SECRET             # brain yêu cầu Authorization: Bearer <APP_SECRET>
# ──────────────────────────────────────────────────────────────
# Đăng ký webhook (sau khi deploy):
#   curl -X POST https://ulife-zalobot.<subdomain>.workers.dev/admin/set-webhook \
#     -H "authorization: Bearer $APP_SECRET" -H "content-type: application/json" \
#     -d '{"url":"https://ulife-zalobot.<subdomain>.workers.dev/webhook/zalobot"}'
